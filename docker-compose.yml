services:
  db:
    image: mysql:8.0
    container_name: db-service
    environment:
      MYSQL_DATABASE: imobiscan
      MYSQL_ROOT_PASSWORD: imobiscan_secure_password
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: dev_password
    ports:
        - "3306:3306"
    volumes:
        - mysql_data:/var/lib/mysql
        

  nest:
      build:
        context: ./backend-nest
        dockerfile: ./docker/Dockerfile
      container_name: nest-api
      ports:
        - "3000:3000"
      volumes:
        - ./backend-nest:/usr/src/app
        - nest_node_modules:/usr/src/app/node_modules
      depends_on:
        - db
        - ocr-service
        - redis


  ocr-service:
    build:
      context: ./backend-python
      dockerfile: docker/Dockerfile
    container_name: ocr-python
    ports:
      - "8000:8000"
    volumes:
      - ./backend-python:/app


  redis:
    image: redis:alpine
    container_name: queue-manager
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]


volumes:
  mysql_data:
  nest_node_modules:
  redis_data:

